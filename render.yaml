services:
  - type: web
    name: tic-toe
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd server && npm install && npx prisma generate && cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://tic-toe-eynw.onrender.com
